name: Build and publish Frog Pond V8
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and patch V5 firmware
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://frog-pond-flasher.floot.app/_cdn/static/frogpond-v5-source.zip' -o v5.zip
          unzip -t v5.zip >/dev/null
          python3 tools/patch_v6.py v5.zip firmware
          python3 tools/patch_v7.py firmware
          python3 tools/patch_v8.py firmware
          python3 - <<'PY'
          from pathlib import Path
          s=next(Path('firmware').rglob('*.ino')).read_text().splitlines()
          names=['void drawFrogHat(', 'void drawFrogSpriteStyled(', 'void drawPersonalize(', 'void tapped(', 'void pollTouch(', 'void openScreen(', 'void drawFace(', 'void render(', 'void loop(', 'frogHatNames', 'frogHat', 'frogTapPending', 'FROG_JUMP_ACTION']
          for key in names:
            matches=[i for i,line in enumerate(s) if key in line]
            for i in matches[:4]:
              print('SOURCE BLOCK',key,'line',i+1)
              print('\\n'.join(f'{j+1}: {s[j]}' for j in range(max(0,i-5),min(len(s),i+65))))
          PY
          test -s firmware/FrogPond_175_PhysicalSteps_V1/FrogPond_175_PhysicalSteps_V1.ino
      - uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-AMOLED-1.75
          path: vendor/waveshare
      - name: Prepare Croak PCM and ES8311 codec driver
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/make_croak_header.py firmware
          python3 tools/make_frog_hop_header.py firmware
          cp vendor/waveshare/examples/arduino/08_ES8311/es8311.c firmware/FrogPond_175_PhysicalSteps_V1/
          cp vendor/waveshare/examples/arduino/08_ES8311/es8311.h firmware/FrogPond_175_PhysicalSteps_V1/
          cp vendor/waveshare/examples/arduino/08_ES8311/es8311_reg.h firmware/FrogPond_175_PhysicalSteps_V1/
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino core 3.3.10
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.10 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile for Waveshare 1.75-inch AMOLED
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi' \
            --libraries vendor/waveshare/examples/arduino/libraries \
            --output-dir build firmware/FrogPond_175_PhysicalSteps_V1
      - name: Package and validate USB firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_v6.py
          test -s site/latest.json
          test -s site/releases/v8.0.0-beta/frogpond.bin
      - uses: actions/upload-artifact@v4
        with:
          name: frogpond-v8-compiled-website
          path: site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    needs: firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
